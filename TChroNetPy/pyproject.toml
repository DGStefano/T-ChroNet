[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tchronet"
version = "0.1.0"
description = "TChroNet: correlation-based network builder from feature matrices"
authors = [
    { name="Your Name", email="your.email@domain.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"

classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "pandas",
    "numpy",
    "deepgraph",
]

[project.scripts]
tchronet = "tchronet.cli:entry_point"